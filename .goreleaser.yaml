version: 2

project_name: muster

before:
  hooks:
    # The dashboard is compiled into the binary by internal/webui's //go:embed, so it must
    # be built before the Go build runs — a stale or absent internal/webui/assets ships a
    # stale or assetless daemon. MUSTER_RELEASE drops the 955 kB sourcemap (web/vite.config.ts).
    # before.hooks takes plain strings (verified against the v2.18 schema — the cmd/dir/env
    # object form is builds.hooks only), and GoReleaser execs them without a shell, hence sh -c.
    - sh -c "cd web && npm ci"
    - sh -c "cd web && MUSTER_RELEASE=1 npm run build"

builds:
  - id: musterd
    main: ./cmd/musterd
    binary: musterd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    # Only `version` — cmd/musterd/main.go declares no commit/date variable, and -X against
    # a symbol that does not exist is silently ignored rather than caught.
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: musterd
    formats:
      - tar.gz
    name_template: "musterd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

# Signs checksums.txt itself (which already carries every archive's SHA-256) rather than
# each archive separately — one signature covers every platform's asset (plan
# auto-update, 2026-09-10, D6/D15/REQ-15/REQ-23). No `ignore_errors` anywhere in this
# block, deliberately (edge case 35/M2): a missing MINISIGN_KEY_FILE/MINISIGN_PASSWORD
# secret must fail the release rather than publish an unsigned checksums.txt with no
# unsigned-fallback path for internal/selfupdate to ever accept.
signs:
  - id: checksums
    artifacts: checksum
    cmd: minisign
    args: ["-S", "-s", "{{ .Env.MINISIGN_KEY_FILE }}", "-m", "${artifact}", "-x", "${signature}", "-t", "muster {{ .Version }}"]
    signature: "${artifact}.minisig"
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"

changelog:
  use: github
  sort: asc
  filters:
    # The notes show exactly the four types that cut the release (docs/conventions.md
    # § Commits) — an include list can't drift as types come and go, unlike the exclude
    # list it replaced (which let perf/build/revert and pre-convention subjects leak into
    # published notes). GoReleaser ignores `exclude` whenever `include` is non-empty.
    include:
      - "^(feat|fix|perf|refactor)[(!:]"

release:
  github:
    owner: Zalaras
    name: muster
