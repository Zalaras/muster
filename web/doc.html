<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muster — document</title>
    <!-- Same no-wrong-theme-first-frame script as index.html (REQ-11) — deliberately
         duplicated, not imported; see index.html's copy for why. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("muster.theme-hint");
          if (!raw) return;
          var hint = JSON.parse(raw);
          if (hint && typeof hint.theme === "string") document.documentElement.dataset.theme = hint.theme;
          if (hint && typeof hint.family === "string") document.documentElement.dataset.claudeFamily = hint.family;
        } catch (e) {
          // swallowed — see comment above.
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="reader-host" class="reader-host"></div>

    <template id="reader-template">
      <section class="reader">
        <div class="docbar">
          <span class="badge">plan</span>
          <span class="fname"></span>
          <span class="path"></span>
          <span class="chg"><i aria-hidden="true"></i><span class="chgtext"></span></span>
          <a class="ib" target="_blank" rel="noopener">pop out ↗</a>
          <button type="button" class="arr" data-role="arr-nav" aria-label="File explorer" aria-expanded="true">›</button>
        </div>
        <div class="reader-notice" role="status" hidden></div>
        <article class="md" tabindex="-1"></article>
        <nav class="rnav" aria-label="Documents">
          <div class="hd" data-role="plan-header">
            <span class="plan-label">plan</span>
          </div>
          <div class="plan-slot" data-role="plan-slot"></div>
          <div class="sep"></div>
          <button type="button" class="hd toggle" data-role="files-toggle" aria-expanded="true" aria-label="Files">
            <span class="dir"></span>
          </button>
          <input type="search" class="filter" placeholder="filter files…" aria-label="Filter files" />
          <div class="tree" data-role="tree"></div>
          <div class="sep"></div>
          <button type="button" class="hd toggle" data-role="outline-toggle" aria-expanded="true" aria-label="Outline">outline</button>
          <div class="outline" data-role="outline"></div>
        </nav>
        <dialog class="modal diagram-modal" aria-label="Diagram">
          <div class="diagram-stage" data-zoom="1.00" tabindex="0">
            <div class="diagram-canvas"></div>
          </div>
          <div class="modal-foot diagram-toolbar">
            <button type="button" class="btn diagram-zoom-in" aria-label="Zoom in">+</button>
            <button type="button" class="btn diagram-zoom-out" aria-label="Zoom out">−</button>
            <button type="button" class="btn diagram-zoom-reset" aria-label="Reset zoom">fit</button>
            <button type="button" class="btn diagram-close">Close</button>
          </div>
        </dialog>
      </section>
    </template>

    <script type="module" src="/src/doc.ts"></script>
  </body>
</html>
