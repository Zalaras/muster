# Repo-side configuration for `go run ./tools/kb` (internal/kb). Required: Load fails without
# it, and an unknown key at any depth fails too. The record model itself — the eight types,
# their statuses and fields, the kb:<type>/<id> citation syntax, the generated-file markers —
# is code; this file holds what is specific to this repo (kb:adr/knowledge-repo-values-live-in-kb-yaml).

# The directory each record type lives in; a spec is <dirs.spec>/<feature>/spec.md.
dirs:
  rule: docs/rules
  decision: docs/adr
  spec: docs/features
  diagram: docs/diagrams
  fact: docs/facts
  lesson: docs/lessons
  runbook: docs/runbooks
  reference: docs/references

paths:
  protocol: docs/protocol.md                 # the one file that carries kb:anchor comments
  root_index: docs/INDEX.md                  # generated store index
  rules_dir: .claude/rules                   # generated per-feature rules files
  conventions: docs/conventions.md           # sliced per role into every pack
  plans_dir: plans                           # plan:<name> refs resolve to plans/<name>/plan.md
  observed_versions: internal/claudecode/observed_versions.txt   # a fact's verified range must sit inside it

# Every pipeline role a lesson may address and a pack may be requested as: the agent files
# under .claude/agents (review-work packs as review) plus the roles the main session plays
# (orchestrator, planner, retro). A role is what a pack is requested as, never a pipeline
# step name. TestRoles_MatchTheAgentFiles keeps this list and the agent directory in step.
roles: [e2e-specs, daemon-impl, web-impl, daemon-tests, web-tests, review, doc-reconcile, orchestrator, retro, planner, review-browser, review-maintainability]

# The closed tag list.
tags: [auth, state-machine, envelope, tmux, store, security, testing, pipeline, claude-code-format, ux, deps, revisit, never, deferred, user-decision, consensus, judged]

# Word and line budgets check enforces as hard failures (internal/kb/budget.go documents each).
budgets:
  body_words: 300
  spec_words: 800
  runbook_words: 600
  summary_chars: 160
  root_claude_lines: 150
  nested_claude_words: 400
  rule_file_lines: 60
  pack_words: 30000

# The tree walk: directories never entered, and the hidden directories it does enter.
tree:
  skip_dirs: [.git, node_modules, web/dist, dist, bin, internal/webui/assets]
  keep_hidden_dirs: [.claude, .githooks, .github]

# Files no citation scan, kb comment check or refs pass reads: frozen plans and history
# record what was true when written, built output is not source, the e2e specs cite
# illustrative paths in their titles.
citations:
  exclude: ["plans/**", "docs/history/**", "docs/research/**", "web/dist/**", "dist/**", "**/node_modules/**", "web/e2e/**/*.spec.ts"]

# Source roots under which every .go and .ts file must be owned by a feature spec's globs.
ownership: [internal, web/src, web/e2e]

# What each role's pack carries (kb:adr/knowledge-pack-sections-scoped-by-role).
pack:
  # A touched feature packs in full, as if in Features: the correctness reviewer is the safety
  # net for a settled decision a light edit breaks, so it reads the records the implementer did not.
  touches_full_roles: [review]
  # No contract slice: the browser reviewer measures the running app and the maintainability
  # reviewer judges shape; neither codes against the wire (5,800 of a 7,300-word feature section, 2026-09-25).
  contractless_roles: [review-browser, review-maintainability]
  # No fact records: the web roles take wire shapes from the contract slice, the two
  # non-correctness reviewers never code against the wire, doc-reconcile verifies against source.
  factless_roles: [web-impl, web-tests, review-browser, review-maintainability, doc-reconcile]
  # No accepted decisions: the unit-test roles test what the plan and contract state, the browser
  # reviewer measures, doc-reconcile edits specs the decisions already shaped. e2e-specs keeps
  # them deliberately as a safety net for the behaviour it asserts.
  decisionless_roles: [daemon-tests, web-tests, review-browser, doc-reconcile]
  # The roles that read the feature-less (system-wide) diagrams; an implementation pack carries
  # only the diagrams naming one of its features. The maintainability reviewer judges shape
  # against the component diagrams, so it reads them too.
  system_diagram_roles: [planner, review, orchestrator, review-maintainability]
  # The roles that rule on this plan's not-yet-accepted decisions.
  proposed_decision_roles: [review, planner]
  # The design documents a role packs, whole or by level-two heading prefix: the web
  # implementer in full, the browser reviewer in the honesty and terminal sections it measures.
  design_docs:
    web-impl:
      - path: docs/design/design-system.md
      - path: docs/design/ux-flows.md
    review-browser:
      - path: docs/design/design-system.md
        sections: ["6.", "7."]
      - path: docs/design/ux-flows.md
  # The docs/conventions.md sections (by level-two heading prefix) each role reads — the full
  # set, so no agent file sends its reader to the file for a section the pack left out; a role
  # absent here reads the whole file. The impl and unit-test roles answer to Design (reuse before
  # add, design: lines); the daemon tester matches the Go test style Stack and Go settle. Comments
  # are nobody's section: the comment pass enforces them on the diff
  # (kb:adr/process-comment-pass-owns-code-comments). The browser reviewer measures the running
  # app; the maintainability reviewer judges shape and never reads the plan, so its rules are the
  # code sections plus Design; the correctness reviewer judges statements against the plan: the
  # code and testing sections, never Commits or Backlog (the orchestrator's) or Design.
  conventions_sections:
    daemon-impl: [Stack, Go, Composition roots, Design, Knowledge records]
    web-impl: [Stack, TypeScript, Composition roots, Design, Knowledge records]
    daemon-tests: [Stack, Go, Design, Testing, Knowledge records]
    web-tests: [Design, Testing, Knowledge records]
    e2e-specs: [Testing, Knowledge records]
    review: [Stack, Go, TypeScript, Composition roots, Testing, Knowledge records]
    review-browser: [Stack, TypeScript, Testing, Knowledge records]
    review-maintainability: [Stack, Go, TypeScript, Composition roots, Design, Knowledge records]

# kb refs: every repo path, make target and flag a comment or markdown line cites must exist
# (kb:adr/knowledge-refs-and-scope-are-kb-subcommands); check runs it over every tracked file.
refs:
  files: ["*.md", "*.go", "*.ts", "*.sh", "Makefile", ".githooks/*"]   # git pathspecs the pass reads
  top_dirs: [docs, internal, web, cmd, spikes, scripts, tools, test, .claude, .githooks, .github]   # a cited path opens with one
  makefile: Makefile
  flags:
    binary: musterd          # a backticked `musterd -flag` token is checked against the flags…
    source: cmd/musterd      # …its non-test Go sources define
  # Tokens that look like repo paths but are not, one reason each; refs reports one that now exists.
  whitelist:
    test/expect/types: a @playwright/test import path, not a repo dir
    cmd/muster-desktop/: the future Wails wrapper (kb:adr/stack-wails-desktop-shell-deferred), deliberately not built

# kb scope: every changed file under these roots needs its owning feature in the plan's
# Features or Touches header (kb:adr/process-touched-features-widen-without-stopping).
scope:
  roots: [cmd, internal, web/src, web/e2e]
  # Judged by what they mirror, not by their glob owner: a generated kb trailer rides every
  # record edit; web/src/protocol.ts mirrors docs/protocol.md, whose anchor's feature owns the
  # change, and plan-work merges it under the plan's own anchors.
  skip: ["**/CLAUDE.md", web/src/protocol.ts]
